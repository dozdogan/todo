<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapılacaklar</title>
<style>
  :root {
    --bg: #f4f1ec;
    --card: #ffffff;
    --text: #2b2a28;
    --muted: #8a867f;
    --line: #e6e1d8;
    --accent: #d9622b;
    --done: #b5b0a7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --card: #262522;
      --text: #ece8e1;
      --muted: #8f8a82;
      --line: #36342f;
      --accent: #f07a42;
      --done: #6b6760;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 48px 16px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 32px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }
  .add {
    padding: 0 18px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    font-weight: 600;
  }
  .filters {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .filters button {
    padding: 4px 12px;
    border-radius: 999px;
    color: var(--muted);
  }
  .filters button.on { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: none; }
  li input[type=checkbox] {
    width: 20px; height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li .text { flex: 1; word-break: break-word; cursor: text; }
  li.done .text { color: var(--done); text-decoration: line-through; }
  li .edit { flex: 1; padding: 4px 8px; }
  li .del {
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    opacity: 0;
  }
  li:hover .del, li .del:focus { opacity: 1; }
  li .del:hover { color: var(--accent); }
  @media (hover: none) { li .del { opacity: 1; } }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  footer {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  footer button { color: var(--muted); }
  footer button:hover { color: var(--accent); }
  .status { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: #fbe3d6; color: #8a3210; font-size: 14px; }
  .hint { margin-top: 24px; font-size: 13px; color: var(--muted); text-align: center; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .user { font-size: 14px; color: var(--muted); text-align: right; word-break: break-all; }
  .user button { color: var(--muted); text-decoration: underline; padding: 0 0 0 6px; }
  .user button:hover { color: var(--accent); }
  .auth {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .auth label { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .auth input { width: 100%; }
  .auth .add { padding: 12px; margin-top: 4px; }
  .auth .switch { font-size: 14px; color: var(--muted); text-align: center; }
  .auth .switch button { color: var(--accent); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main>
  <div class="top">
    <h1>Yapılacaklar</h1>
    <span class="user" id="user" hidden><span id="username"></span><button id="logout">Çıkış</button></span>
  </div>
  <p class="sub" id="date"></p>

  <p class="status" id="status" hidden></p>

  <form class="auth" id="auth" hidden>
    <label>E-posta
      <input type="email" id="auth-user" autocomplete="email" required>
    </label>
    <label>Şifre
      <input type="password" id="auth-pass" autocomplete="current-password" required>
    </label>
    <button class="add" type="submit" id="auth-submit">Giriş yap</button>
    <p class="switch"><span id="auth-q">Hesabın yok mu?</span> <button type="button" id="auth-toggle">Kayıt ol</button></p>
  </form>

  <form class="auth" id="verify" hidden>
    <p style="margin:0"><strong id="verify-email"></strong> adresine 6 haneli bir onay kodu gönderdik. Kodu aşağıya yaz.</p>
    <label>Onay kodu
      <input type="text" id="verify-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
    </label>
    <button class="add" type="submit" id="verify-submit">Onayla</button>
    <p class="switch">
      <button type="button" id="verify-resend">Kodu tekrar gönder</button> ·
      <button type="button" id="verify-back">Geri dön</button>
    </p>
  </form>

  <div id="app" hidden>
  <form id="form">
    <input type="text" id="input" placeholder="Yeni görev ekle…" autocomplete="off" autofocus>
    <button class="add" type="submit">Ekle</button>
  </form>

  <div class="filters" id="filters">
    <button data-f="all" class="on">Tümü</button>
    <button data-f="active">Yapılacak</button>
    <button data-f="done">Tamamlanan</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="count"></span>
    <button id="clear">Tamamlananları sil</button>
  </footer>

  <p class="hint">Düzenlemek için göreve çift tıkla.</p>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://kqklosaelkpmhhwldmfb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_G6ApdS5dAq9qBWYiKaBUfw_K8iHbU1d";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let token = null;
  let signupMode = false;

  let items = [];
  let filter = "all";
  let loaded = false;

  const $ = (id) => document.getElementById(id);
  const list = $("list");

  $("date").textContent = new Date().toLocaleDateString("tr-TR", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  async function api(method, query = "", body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/todos${query}`, {
      method,
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) throw new Error(await res.text());
    return res.status === 204 ? null : res.json();
  }

  function showError(err, text) {
    console.error(err);
    $("status").textContent = text || "Supabase'e bağlanılamadı. İnternet bağlantını kontrol edip sayfayı yenile.";
    $("status").hidden = false;
  }

  // ---- Giriş ----

  function setSignupMode(on) {
    signupMode = on;
    $("auth-submit").textContent = on ? "Kayıt ol" : "Giriş yap";
    $("auth-q").textContent = on ? "Zaten hesabın var mı?" : "Hesabın yok mu?";
    $("auth-toggle").textContent = on ? "Giriş yap" : "Kayıt ol";
    $("auth-pass").autocomplete = on ? "new-password" : "current-password";
    $("status").hidden = true;
  }

  function authMessage(error) {
    const m = (error.message || "").toLowerCase();
    if (m.includes("invalid login")) return "E-posta ya da şifre yanlış.";
    if (m.includes("already registered") || m.includes("already exists")) return "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.";
    if (m.includes("expired") || m.includes("invalid") && m.includes("token")) return "Kod yanlış ya da süresi dolmuş.";
    if (m.includes("email") && m.includes("invalid")) return "Geçerli bir e-posta adresi yaz.";
    if (m.includes("sending") && m.includes("email")) return "Onay maili gönderilemedi. Biraz sonra tekrar dene.";
    if (m.includes("password")) return "Şifre en az 8 karakter olmalı.";
    if (m.includes("rate limit") || m.includes("security purposes")) return "Çok sık deneme yapıldı. Bir dakika bekleyip tekrar dene.";
    return "Bir hata oldu: " + error.message;
  }

  let pendingEmail = null;

  function showVerify(email) {
    pendingEmail = email;
    $("verify-email").textContent = email;
    $("verify-code").value = "";
    $("auth").hidden = true;
    $("verify").hidden = false;
    $("verify-code").focus();
  }

  function info(text) {
    $("status").textContent = text;
    $("status").hidden = false;
  }

  $("auth-toggle").onclick = () => setSignupMode(!signupMode);

  $("auth").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("auth-user").value.trim().toLowerCase();
    const password = $("auth-pass").value;
    $("status").hidden = true;
    $("auth-submit").disabled = true;
    const { data, error } = signupMode
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
    $("auth-submit").disabled = false;

    if (error) {
      // Kaydolmuş ama kodu girmemiş biri giriş yapmaya çalışırsa yeni kod gönder.
      if ((error.message || "").toLowerCase().includes("not confirmed")) {
        await sb.auth.resend({ type: "signup", email });
        $("auth-pass").value = "";
        showVerify(email);
        return info("E-posta adresin henüz onaylanmamış. Yeni bir kod gönderdik.");
      }
      return showError(error, authMessage(error));
    }
    $("auth-pass").value = "";
    if (signupMode && !data.session) {
      // Bu e-postayla zaten onaylı bir hesap varsa Supabase boş kimlik listesi döner.
      if (data.user && data.user.identities && data.user.identities.length === 0) {
        setSignupMode(false);
        return showError(null, "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.");
      }
      showVerify(email);
    }
  };

  $("verify").onsubmit = async (e) => {
    e.preventDefault();
    const token = $("verify-code").value.trim();
    $("status").hidden = true;
    $("verify-submit").disabled = true;
    const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token, type: "signup" });
    $("verify-submit").disabled = false;
    if (error) return showError(error, authMessage(error));
  };

  $("verify-resend").onclick = async () => {
    const { error } = await sb.auth.resend({ type: "signup", email: pendingEmail });
    if (error) return showError(error, authMessage(error));
    info("Yeni kod gönderildi. Gelen kutunu (ve gereksiz klasörünü) kontrol et.");
  };

  $("verify-back").onclick = () => {
    pendingEmail = null;
    $("verify").hidden = true;
    $("auth").hidden = false;
    $("status").hidden = true;
  };

  $("logout").onclick = () => sb.auth.signOut();

  let currentUser = null;
  sb.auth.onAuthStateChange((event, session) => {
    token = session?.access_token || null;
    const user = session?.user || null;
    $("auth").hidden = !!user || !$("verify").hidden;
    if (user) $("verify").hidden = true;
    $("app").hidden = !user;
    $("user").hidden = !user;
    if (!user) {
      currentUser = null;
      items = [];
      loaded = false;
      return;
    }
    $("username").textContent = user.email;
    // Token yenilenince listeyi baştan yüklemeye gerek yok.
    if (currentUser === user.id) return;
    currentUser = user.id;
    $("status").hidden = true;
    loaded = false;
    render();
    setTimeout(() => run(loadAll));
  });

  async function run(fn) {
    try { await fn(); $("status").hidden = true; }
    catch (err) { showError(err); }
    render();
  }

  async function loadAll() {
    items = await api("GET", "?select=*&order=created_at.asc,id.asc");
    loaded = true;
  }

  async function addItem(text) {
    const [row] = await api("POST", "", { text });
    items.push(row);
  }

  async function updateItem(item, fields) {
    await api("PATCH", `?id=eq.${item.id}`, fields);
    Object.assign(item, fields);
  }

  async function deleteItem(item) {
    await api("DELETE", `?id=eq.${item.id}`);
    items = items.filter(i => i !== item);
  }

  function render() {
    list.innerHTML = "";
    const shown = items.filter(i =>
      filter === "all" ? true : filter === "done" ? i.done : !i.done
    );

    if (shown.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = !loaded ? "Yükleniyor…"
        : items.length ? "Bu filtrede görev yok."
        : "Henüz görev yok. Yukarıdan ekleyebilirsin.";
      list.appendChild(li);
    }

    for (const item of shown) {
      const li = document.createElement("li");
      if (item.done) li.classList.add("done");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = item.done;
      cb.onchange = () => run(() => updateItem(item, { done: cb.checked }));

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = item.text;
      span.ondblclick = () => startEdit(li, span, item);

      const del = document.createElement("button");
      del.className = "del";
      del.title = "Sil";
      del.textContent = "×";
      del.onclick = () => run(() => deleteItem(item));

      li.append(cb, span, del);
      list.appendChild(li);
    }

    const left = items.filter(i => !i.done).length;
    $("count").textContent = loaded ? `${left} görev kaldı` : "";
    $("clear").style.visibility = items.some(i => i.done) ? "visible" : "hidden";
  }

  function startEdit(li, span, item) {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "edit";
    input.value = item.text;
    li.replaceChild(input, span);
    input.focus();
    input.select();

    let finished = false;
    const finish = (keep) => {
      if (finished) return;
      finished = true;
      const v = input.value.trim();
      if (!keep || v === item.text) return render();
      run(() => v ? updateItem(item, { text: v }) : deleteItem(item));
    };
    input.onkeydown = (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    };
    input.onblur = () => finish(true);
  }

  $("form").onsubmit = (e) => {
    e.preventDefault();
    const v = $("input").value.trim();
    if (!v) return;
    $("input").value = "";
    run(() => addItem(v));
  };

  $("filters").onclick = (e) => {
    const f = e.target.dataset.f;
    if (!f) return;
    filter = f;
    for (const b of $("filters").children) b.classList.toggle("on", b.dataset.f === f);
    render();
  };

  $("clear").onclick = () => run(async () => {
    await api("DELETE", "?done=eq.true");
    items = items.filter(i => !i.done);
  });

  render();
</script>
</body>
</html>
